services:
  garage:
    image: docker.io/dxflrs/garage:v2.5.0
    container_name: eurogrid-garage
    command: ["/garage", "server", "--single-node"]
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,Z
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  garage-webui:
    image: docker.io/khairul169/garage-webui:1.1.0
    container_name: eurogrid-garage-webui
    restart: unless-stopped
    depends_on:
      - garage
    ports:
      - "127.0.0.1:3909:3909"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,Z
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      S3_REGION: "garage"

  prefect-server:
    image: docker.io/prefecthq/prefect:3-python3.12
    container_name: eurogrid-prefect-server
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/home/prefect/.prefect
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prefect-worker:
    build:
      context: .
      dockerfile: infra/prefect/Dockerfile
    image: eurogrid-prefect-worker:latest
    pull_policy: build
    container_name: eurogrid-prefect-worker
    restart: unless-stopped
    depends_on:
      - prefect-server
      - garage
      - iceberg-rest
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      EUROGRID_DATA_DIR: /data
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://eurogrid-warehouse/
      GARAGE_S3_ENDPOINT: http://garage:3900
      GARAGE_S3_REGION: garage
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      REDPANDA_BROKERS: redpanda:9092
      TRINO_URL: http://trino:8081
      OPENLINEAGE_URL: http://marquez:5000
    volumes:
      - ./data:/data:Z
      - ./flows:/app/flows:ro,Z
      - ./src:/app/src:ro,Z
      - ./prefect.yaml:/app/prefect.yaml:ro,Z

  iceberg-rest:
    build:
      context: .
      dockerfile: infra/iceberg/Dockerfile
    image: eurogrid-iceberg-rest:latest
    pull_policy: build
    container_name: eurogrid-iceberg-rest
    restart: unless-stopped
    depends_on:
      - garage
      - postgres
    ports:
      - "8181:8181"
    command:
      - java
      - -cp
      - /usr/lib/iceberg-rest/iceberg-rest-adapter.jar:/opt/jdbc/postgresql-42.7.4.jar
      - org.apache.iceberg.rest.RESTCatalogServer
    environment:
      CATALOG_NAME: eurogrid
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg
      CATALOG_JDBC_USER: eurogrid
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-eurogrid}
      CATALOG_WAREHOUSE: s3://eurogrid-warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://garage:3900
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_REGION: garage
      CATALOG_S3_ACCESS__KEY__ID: ${GARAGE_S3_ACCESS_KEY}
      CATALOG_S3_SECRET__ACCESS__KEY: ${GARAGE_S3_SECRET_KEY}
      AWS_REGION: garage
      AWS_DEFAULT_REGION: garage
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required

  postgres:
    image: docker.io/library/postgres:16
    container_name: eurogrid-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: eurogrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eurogrid}
      POSTGRES_DB: iceberg
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurogrid -d iceberg"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s


  streaming-producer:
    build:
      context: .
      dockerfile: infra/streaming/Dockerfile
    image: eurogrid-streaming:latest
    container_name: eurogrid-streaming-producer
    restart: unless-stopped
    depends_on:
      - redpanda
    env_file:
      - .env
    environment:
      REDPANDA_BROKERS: redpanda:9092
      ENTSOE_POLLING_INTERVAL: "300"
      EUROGRID_DATA_DIR: /data
    command: ["python", "-m", "eurogrid.streaming.producers.entsoe_producer"]
    volumes:
      - ./src:/app/src:ro,Z

  streaming-consumer:
    build:
      context: .
      dockerfile: infra/streaming/Dockerfile
    image: eurogrid-streaming:latest
    container_name: eurogrid-streaming-consumer
    restart: unless-stopped
    depends_on:
      - redpanda
    env_file:
      - .env
    environment:
      REDPANDA_BROKERS: redpanda:9092
      REDPANDA_STREAM_TOPIC: entsoe.actual_load
      ENTSOE_BRONZE_PATH: /data/bronze/entsoe_actual_load
      ENTSOE_CHECKPOINT_PATH: /data/checkpoints/entsoe_actual_load
    command: ["python", "-m", "eurogrid.streaming.consumers.entsoe_consumer"]
    volumes:
      - ./data:/data:Z
      - ./src:/app/src:ro,Z

  redpanda:
    image: docker.io/redpandadata/redpanda:v26.2.7
    container_name: eurogrid-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:39092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082,OUTSIDE://0.0.0.0:39080
      - --advertise-pandaproxy-addr=PLAINTEXT://redpanda:8082,OUTSIDE://localhost:38082
    ports:
      - "9092:39092"
      - "38082:39080"
      - "127.0.0.1:9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9644/v1/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redpanda-topics:
    image: docker.io/redpandadata/redpanda:v26.2.7
    container_name: eurogrid-redpanda-topics
    restart: "no"
    depends_on:
      - redpanda
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        n=0
        until rpk topic create \
          -X brokers=redpanda:9092 \
          --partitions 3 --replicas 1 \
          --if-not-exists \
          eurogrid.events eurogrid.events.dlq entsoe.actual_load; do
          n=$$((n+1))
          if [ "$${n}" -ge 30 ]; then
            echo "redpanda belum siap, topic tidak dibuat" >&2
            exit 1
          fi
          sleep 2
        done

  trino:
    image: docker.io/trinodb/trino:484
    container_name: eurogrid-trino
    restart: unless-stopped
    depends_on:
      - iceberg-rest
      - garage
    ports:
      - "8081:8081"
    env_file:
      - .env
    volumes:
      - ./infra/trino/etc/config.properties:/etc/trino/config.properties:ro,Z
      - ./infra/trino/etc/jvm.config:/etc/trino/jvm.config:ro,Z
      - ./infra/trino/etc/node.properties:/etc/trino/node.properties:ro,Z
      - ./infra/trino/etc/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro,Z
      - trino-data:/data/trino
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/v1/status"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  mlflow:
    build:
      context: .
      dockerfile: infra/mlflow/Dockerfile
    image: localhost/eurogrid-mlflow:latest
    container_name: eurogrid-mlflow
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:5000:5000"
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://eurogrid:${POSTGRES_PASSWORD:-eurogrid}@postgres:5432/mlflow
      - --default-artifact-root=/mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  metabase:
    # v0.60.3.3, dipin per digest (tag persis tidak tersedia di registry)
    image: docker.io/metabase/metabase@sha256:66567d39bf2d03be6f33deefacbb24790131aeacca7cf1d5e206fefe892fcb42
    container_name: eurogrid-metabase
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_HOST: postgres
      MB_DB_USER: eurogrid
      MB_DB_PASS: ${POSTGRES_PASSWORD:-eurogrid}
    volumes:
      - metabase-data:/metabase-data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  marquez-db:
    image: docker.io/library/postgres:16
    container_name: eurogrid-marquez-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  marquez:
    image: docker.io/marquezproject/marquez:0.51.1
    container_name: eurogrid-marquez
    restart: unless-stopped
    depends_on:
      marquez-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      SEARCH_ENABLED: "false"

  marquez-web:
    image: docker.io/marquezproject/marquez-web:0.51.1
    container_name: eurogrid-marquez-web
    restart: unless-stopped
    depends_on:
      - marquez
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"

  metrics-exporter:
    build:
      context: .
      dockerfile: infra/metrics/Dockerfile
    image: localhost/eurogrid-metrics:latest
    container_name: eurogrid-metrics
    restart: unless-stopped
    depends_on:
      - iceberg-rest
    env_file:
      - .env
    environment:
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://eurogrid-warehouse/
      GARAGE_S3_ENDPOINT: http://garage:3900
      GARAGE_S3_REGION: garage
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      PREFECT_API_URL: http://prefect-server:4200/api
      METRICS_PORT: "9101"
      METRICS_INTERVAL_SECONDS: "60"
    ports:
      - "127.0.0.1:9101:9101"


  prometheus:
    # v3.11.3, dipin per digest
    image: docker.io/prom/prometheus@sha256:387d460e3b15ec55d2837fc9275388a4730dbc8c0287926d3f662c5298ce7385
    container_name: eurogrid-prometheus
    restart: unless-stopped
    depends_on:
      - metrics-exporter
      - node-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,Z
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 15s
  alertmanager:
    image: docker.io/prom/alertmanager:v0.27.0
    container_name: eurogrid-alertmanager
    restart: unless-stopped
    depends_on:
      - alert-sink
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,Z
      - alertmanager-data:/alertmanager

  alert-sink:
    image: docker.io/library/python:3.12-slim
    container_name: eurogrid-alert-sink
    restart: unless-stopped
    command: ["python", "/srv/sink.py"]
    environment:
      ALERT_SINK_FILE: /data/alerts.jsonl
      ALERT_SINK_PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/alerts/sink.py:/srv/sink.py:ro,Z
      - alerts-data:/data

  node-exporter:
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: eurogrid-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /:/host:ro


  grafana:
    # 13.0.1+security-01, dipin per digest
    image: docker.io/grafana/grafana@sha256:135f4b96b7a54f904415dc51e71a1cd945b1f8400772b2feac2df5112b43f4ed
    container_name: eurogrid-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s


volumes:
  garage-meta:
  garage-data:
  prefect-data:
  pg-data:
  redpanda-data:
  trino-data:
  mlflow-data:
  metabase-data:
  grafana-data:
  marquez-db-data:
  prometheus-data:
  alertmanager-data:
  alerts-data:
