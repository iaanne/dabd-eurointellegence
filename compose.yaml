services:
  garage:
    image: docker.io/dxflrs/garage:v2.5.0
    container_name: eurogrid-garage
    command: ["/garage", "server", "--single-node"]
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3903:3903"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,Z
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  garage-webui:
    image: docker.io/khairul169/garage-webui:1.1.0
    container_name: eurogrid-garage-webui
    restart: unless-stopped
    depends_on:
      - garage
    ports:
      - "127.0.0.1:3909:3909"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro,Z
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      S3_REGION: "garage"

  prefect-server:
    image: docker.io/prefecthq/prefect:3-python3.12
    container_name: eurogrid-prefect-server
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    ports:
      - "4200:4200"
    volumes:
      - prefect-data:/home/prefect/.prefect
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  prefect-worker:
    build:
      context: .
      dockerfile: infra/prefect/Dockerfile
    image: localhost/eurogrid-prefect-worker:latest
    container_name: eurogrid-prefect-worker
    restart: unless-stopped
    depends_on:
      - prefect-server
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      EUROGRID_DATA_DIR: /data
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://eurogrid-warehouse/
      GARAGE_S3_ENDPOINT: http://garage:3900
      GARAGE_S3_REGION: garage
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      OPENLINEAGE_URL: http://marquez:5000
    volumes:
      - ./data:/data:Z
      - ./flows:/app/flows:ro,Z
      - ./src:/app/src:ro,Z
      - ./prefect.yaml:/app/prefect.yaml:ro,Z

  iceberg-rest:
    build:
      context: .
      dockerfile: infra/iceberg/Dockerfile
    image: localhost/eurogrid-iceberg-rest:latest
    container_name: eurogrid-iceberg-rest
    restart: unless-stopped
    depends_on:
      - garage
      - postgres
    ports:
      - "8181:8181"
    command:
      - java
      - -cp
      - /usr/lib/iceberg-rest/iceberg-rest-adapter.jar:/opt/jdbc/postgresql-42.7.4.jar
      - org.apache.iceberg.rest.RESTCatalogServer
    environment:
      CATALOG_NAME: eurogrid
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg
      CATALOG_JDBC_USER: eurogrid
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-eurogrid}
      CATALOG_WAREHOUSE: s3://eurogrid-warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://garage:3900
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_REGION: garage
      CATALOG_S3_ACCESS__KEY__ID: ${GARAGE_S3_ACCESS_KEY}
      CATALOG_S3_SECRET__ACCESS__KEY: ${GARAGE_S3_SECRET_KEY}
      AWS_REGION: garage
      AWS_DEFAULT_REGION: garage
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required

  postgres:
    image: docker.io/library/postgres:16
    container_name: eurogrid-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: eurogrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eurogrid}
      POSTGRES_DB: iceberg
    volumes:
      - pg-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eurogrid -d iceberg"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  marquez-db:
    image: docker.io/library/postgres:16
    container_name: eurogrid-marquez-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db-data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez -d marquez"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  marquez:
    image: docker.io/marquezproject/marquez:0.51.1
    container_name: eurogrid-marquez
    restart: unless-stopped
    depends_on:
      marquez-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5001:5000"
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      SEARCH_ENABLED: "false"

  marquez-web:
    image: docker.io/marquezproject/marquez-web:0.51.1
    container_name: eurogrid-marquez-web
    restart: unless-stopped
    depends_on:
      - marquez
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"

  metrics-exporter:
    build:
      context: .
      dockerfile: infra/metrics/Dockerfile
    image: localhost/eurogrid-metrics:latest
    container_name: eurogrid-metrics
    restart: unless-stopped
    depends_on:
      - iceberg-rest
    env_file:
      - .env
    environment:
      ICEBERG_CATALOG_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://eurogrid-warehouse/
      GARAGE_S3_ENDPOINT: http://garage:3900
      GARAGE_S3_REGION: garage
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      PREFECT_API_URL: http://prefect-server:4200/api
      METRICS_PORT: "9101"
      METRICS_INTERVAL_SECONDS: "60"
    ports:
      - "127.0.0.1:9101:9101"

  prometheus:
    image: docker.io/prom/prometheus:v2.54.1
    container_name: eurogrid-prometheus
    restart: unless-stopped
    depends_on:
      - metrics-exporter
      - node-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - prometheus-data:/prometheus

  node-exporter:
    image: docker.io/prom/node-exporter:v1.8.2
    container_name: eurogrid-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /:/host:ro

  grafana:
    image: docker.io/grafana/grafana-oss:11.2.2
    container_name: eurogrid-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-eurogrid}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana-data:/var/lib/grafana

volumes:
  garage-meta:
  garage-data:
  prefect-data:
  pg-data:
  marquez-db-data:
  prometheus-data:
  grafana-data:

