global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: eurogrid
    metrics_path: /metrics
    static_configs:
      - targets: ["metrics-exporter:9101"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
