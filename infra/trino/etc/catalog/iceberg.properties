# Katalog Iceberg via REST catalog di Iceberg REST server.
# Data dan metadata tabel disimpan di Garage S3.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://eurogrid-warehouse/
fs.native-s3.enabled=true
s3.endpoint=http://garage:3900
s3.path-style-access=true
s3.region=garage
s3.aws-access-key=${ENV:GARAGE_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:GARAGE_S3_SECRET_KEY}
