n:me: eurogrid
prefect-version: "3"

build: null
push: null
pull: null

deployments:
  - name: production
    description: >-
      Isi Bronze harian dari Energy-Charts, Open-Meteo, dan ENTSO-E, lalu picu
      run Silver setelah tabel Bronze terbit.
    entrypoint: flows/bronze_daily.py:bronze_daily
    tags:
      - bronze
      - daily
    parameters:
      days: 7
    work_pool:
      name: eurogrid-pool
    schedules:
      - cron: "0 5 * * *"
        timezone: Europe/Berlin
        active: true

  - name: production
    description: >-
      Validasi Bronze menjadi Silver, karantina, dan laporan mutu. Tidak punya
      jadwal sendiri: dipicu oleh flow Bronze setelah tabel Bronze terbit.
    entrypoint: flows/silver_daily.py:silver_daily
    tags:
      - silver
      - daily
    parameters:
      datasets: null
    work_pool:
      name: eurogrid-pool

